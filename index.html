<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronke Survival</title>
    <style>
        body {
            margin: 0;
            background-color: #0b1120;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Estilo del selector de idioma */
        #lang-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal {
            background: #0f172a;
            border: 2px solid #38bdf8;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        h1 {
            color: #facc15;
            letter-spacing: 2px;
            font-size: 24px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
        }
        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        .btn-wallet {
            background: #3b82f6;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            margin-top: 10px;
            box-sizing: border-box;
            font-family: monospace;
        }
        .status {
            color: #f87171;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Botón para cambiar de idioma -->
    <button id="lang-selector" onclick="toggleLanguage()">ES / EN</button>

    <div class="modal">
        <h1 id="txt-title">RONKE SURVIVAL</h1>
        <p id="txt-desc">3000x3000px open world with cars, billboards, Jihoz statues and cybernetic hordes.</p>
        
        <button class="btn" id="txt-play">🎮 PLAY AS GUEST</button>
        
        <p id="txt-wallet-label" style="margin-top: 20px; text-align: left;">WalletConnect (Ronin / Mobile):</p>
        <input type="text" value="3a8170812b534d0ff9d794f19a901d64" readonly>
        
        <div class="status" id="txt-status">Status: Waiting for connection</div>
        
        <button class="btn btn-wallet" id="txt-connect">🔗 CONNECT RONIN WALLET</button>
    </div>

    <script>
        // Diccionario de idiomas
        const translations = {
            en: {
                title: "RONKE SURVIVAL",
                desc: "3000x3000px open world with cars, billboards, Jihoz statues and cybernetic hordes.",
                play: "🎮 PLAY AS GUEST",
                walletLabel: "WalletConnect (Ronin / Mobile):",
                status: "Status: Waiting for connection",
                connect: "🔗 CONNECT RONIN WALLET",
                langButton: "🌐 Español"
            },
            es: {
                title: "RONKE SURVIVAL",
                desc: "Mundo abierto de 3000x3000px con autos, carteles, estatuas de Jihoz y hordas cibernéticas.",
                play: "🎮 JUGAR DE INVITADO",
                walletLabel: "WalletConnect (Ronin / Mobile):",
                status: "Status: Esperando conexión",
                connect: "🔗 CONECTAR RONIN WALLET",
                langButton: "🌐 English"
            }
        };

        // Idioma predeterminado: INGLÉS ('en')
        let currentLang = 'en';

        function toggleLanguage() {
            // Cambiar idioma actual
            currentLang = currentLang === 'en' ? 'es' : 'en';
            updateTexts();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-desc').innerText = t.desc;
            document.getElementById('txt-play').innerText = t.play;
            document.getElementById('txt-wallet-label').innerText = t.walletLabel;
            document.getElementById('txt-status').innerText = t.status;
            document.getElementById('txt-connect').innerText = t.connect;
            document.getElementById('lang-selector').innerText = t.langButton;
        }

        // Ejecutar al cargar para asegurar que inicie en Inglés
        updateTexts();
    </script>
</body>
</html>
